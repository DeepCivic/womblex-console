name: Publish image

# Publishes the console image to GHCR when a version is tagged. A manual
# dispatch publishes under an `edge-<sha>` tag so the path can be exercised
# without cutting a version.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # GHCR accepts the ambient token for the repository's own packages, so
      # there is no secret to provision and none to leak.
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Name the image and the tags it publishes under
        id: name
        # GHCR rejects an upper-case path, so the owner is lower-cased.
        # `latest` moves only for a final release: a version carrying a hyphen
        # (v1.0.0-rc1) publishes under its own tag and leaves `latest` alone.
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          image="$REGISTRY/$owner/womblex-console"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            tags="$image:$version"
            case "$version" in
              *-*) echo "pre-release $version: leaving :latest where it is" ;;
              *)   tags="$tags,$image:latest" ;;
            esac
          else
            tags="$image:edge-${GITHUB_SHA:0:12}"
          fi
          {
            echo "image=$image"
            echo "tags=$tags"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.name.outputs.tags }}
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
            REQUIRE_STAMP=1
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record the digest
        run: |
          {
            echo "### womblex-console"
            echo '```'
            echo "${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
