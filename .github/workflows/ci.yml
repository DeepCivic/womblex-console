name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.7"
          python-version: "3.12"
          enable-cache: true

      - name: The lock matches pyproject.toml
        run: uv lock --check

      - name: Install from the lock
        # The locked set, Womblex included at the commit the lock names. A new
        # Womblex release reaches CI only through a lock change on a PR.
        run: uv sync --frozen --extra dev

      - name: Lint (ruff)
        run: uv run --no-sync ruff check src/ tests/

      - name: Type-check (mypy)
        run: uv run --no-sync mypy src/

      - name: Tests
        run: uv run --no-sync python -m pytest tests/ -v

  frontend:
    name: Frontend (ui/)
    runs-on: ubuntu-latest
    # A broken SvelteKit build fails its own job, not the Python one.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        working-directory: ui
        run: npm ci

      - name: Lint (eslint)
        working-directory: ui
        run: npm run lint

      - name: Type-check (svelte-check)
        working-directory: ui
        run: npm run check

      - name: Build (vite)
        working-directory: ui
        run: npm run build

  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    # Known advisories in the locked Python set and the npm lock, so a new one
    # shows on the PR that would ship it. Reported, not gating.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.7"
          python-version: "3.12"

      - name: Python (pip-audit over the lock)
        run: |
          uv export --frozen --all-extras --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit@2.10.1 --disable-pip -r "$RUNNER_TEMP/requirements.txt"

      - name: npm audit, high and above
        if: ${{ !cancelled() }}
        working-directory: ui
        run: npm audit --audit-level=high

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim runner disk
        # Womblex's dependency set is large; the preinstalled toolchains are
        # what the build would otherwise run out of room behind.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: womblex-console:ci
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
            REQUIRE_STAMP=1
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The image names its commit
        run: |
          label=$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' womblex-console:ci)
          echo "label=$label expected=$GITHUB_SHA"
          test "$label" = "$GITHUB_SHA"

      - name: The console serves
        # Pointed at an empty local run root: liveness, and that the image
        # carries the dependencies the routes import.
        run: |
          mkdir -p "$RUNNER_TEMP/runs"
          docker run -d --name console -p 8080:8080 \
            -v "$RUNNER_TEMP/runs:/runs:ro" \
            -e WOMBLEX_UI_OUTPUT_ROOT=/runs womblex-console:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health; then served=1; break; fi
            sleep 2
          done
          docker logs console
          test "${served:-0}" = "1"
          curl -fsS http://localhost:8080/api/runs
