# Semantic tags for the ISM.
#
# STEAL: Section-level semantic tags for all 1101 ISM controls, with the code /
# infrastructure / organisational surface judgement that says which of them a repository
# could ever evidence. Contains no ISM text, so it is Apache-2.0 and carries no CC BY
# obligation of its own.
#
# runwAI's judgement about what each part of the ISM is *about*, kept deliberately
# separate from controls/ism-snapshot.json. The snapshot is (c) Commonwealth of Australia
# under CC BY 4.0; this file is ours, Apache-2.0, and nothing in it is ISM text. Keeping
# them apart means neither licence has to be argued about when either file is reused.
#
# WHY TAG SECTIONS RATHER THAN CONTROLS
#
# Measured against the snapshot: 1101 controls, 22 guidelines, 70 guideline+section pairs,
# 450 guideline+section+topic triples. Twenty-two is too coarse to be useful and 450 is
# past what anyone will actually read, so the judgement is made once per section and every
# control in it inherits. Seventy claims can be checked by a person in one sitting; 1101
# cannot, and 1101 fluent-looking assignments nobody checked is the exact failure mode
# AGENTS.md's verification-discipline section describes.
#
# `overrides` exists for controls the section gets wrong, and starts nearly empty on
# purpose. A long override list written on day one would reintroduce the unreviewable
# problem through the back door. Add one when a specific control is misplaced, with a
# reason.
#
# WHAT IS NOT A TAG
#
# `essential_eight` and `applicable` stay in the snapshot as carried ISM facts and are not
# tagging axes. They answer "which ASD programme is this part of" and "at what
# classification", not "does this concern the code I am writing". Mixing the two produces
# a vocabulary that answers neither question well.
#
# TAGGING IS CLASSIFICATION, NOT ADJUDICATION
#
# The core invariant forbids a model deciding whether a control passes. Deciding that
# ISM-1876 is about patching is not that — it is setup work, which the invariant permits.
# The safeguard is that every assignment here is reviewable, not that no agent wrote it.

version: 1

# The primary axis: can this be evidenced from a repository at all?
#
#   code            visible in source, dependencies or tests
#   infrastructure  visible in deployed or declared infrastructure
#   organisational  people, policy, physical premises, process. Never evidenced from a repo
#
# A section may carry more than one. A section carrying only `organisational` is out of
# scope for automation by definition, and a report must say so rather than showing it as
# unimplemented.
#
# A surface says where a control's evidence lives. It does NOT say runwAI can reach it.
# ISM-0260 — "all web access is conducted through web proxies" — carries `infrastructure`
# and no repository declares it. Counting surfaces as automatable coverage would be exactly
# the claim README.md's "Honesty about scope" section refuses to make.
surfaces: [code, infrastructure, organisational]

# The semantic vocabulary. Closed set: a tag not listed here fails the self-check, so the
# vocabulary grows by deliberate edit rather than by drift.
vocabulary:
  access-control: Who may reach a system or its data, and on what terms
  administration: Privileged administration of systems
  ai: Artificial intelligence and machine learning systems
  application-security: Building software securely; the development lifecycle itself
  assurance: Assessment, testing and verification of security claims
  authentication: Proving identity — credentials, multi-factor, sessions
  backup: Backup, restoration and the integrity of both
  cabling: Physical cable plant and its installation
  cloud: Managed, outsourced and cloud-hosted services
  content-filtering: Inspecting and filtering content in transit
  continuity: Availability, resilience and denial-of-service resistance
  cryptography: Algorithms, keys, and their correct use
  data-transfer: Moving data between systems or security domains
  database: Database servers and the data in them
  disposal: End-of-life destruction and disposal
  documentation: Written policy, plans and system documentation
  email: Email systems and their use
  emanation: Unintended electromagnetic emission
  gateway: Boundary devices between networks or domains
  governance: Roles, accountability and organisational oversight
  hardening: Reducing the attack surface of a deployed system
  incident-response: Detecting, managing and responding to incidents
  logging: Generating and retaining event records
  maintenance: Keeping systems serviceable and supported
  media: Removable and fixed storage media
  mobile: Mobile devices and their management
  monitoring: Watching systems for signs of compromise
  network: Network design, configuration and segmentation
  patching: Applying security updates within a timeframe
  peripherals: Peripheral devices and switches
  personnel: People, clearances and their access
  physical: Physical security of premises and equipment
  procurement: Buying, evaluating and outsourcing
  remote-access: Administrative and user access from elsewhere
  sanitisation: Erasing data so it cannot be recovered
  segmentation: Separating networks and systems by criticality
  supply-chain: Third-party components and their provenance
  telephony: Voice, fax and video communications
  training: Awareness and skills development
  transport: Protecting data in transit
  virtualisation: Hypervisors and containers
  web: Web applications, servers and browsing
  wireless: Wireless networks and their configuration

# One entry per guideline+section pair. All 70 are present; the self-check fails if the
# snapshot contains a pair this file does not cover, so a new ISM release cannot quietly
# add an untagged section.
sections:
