# Controls whose section gets them wrong. Each needs a reason: an override with no argument
# is indistinguishable from a mistake, and this is the file where a wrong entry is least
# visible.
#
# Deliberately short. Every entry here is a claim about one specific control, checked
# against its text in the snapshot — which is why they are added as they are found rather
# than generated in a batch.
overrides:
  ISM-1876:
    surfaces: [code, infrastructure]
    tags: [patching, supply-chain]
    reason: >-
      Section is System maintenance, which inherits organisational. This control is a
      48-hour patching timeframe for internet-facing services and is evidenced from a
      dependency manifest and a deployment record, not from policy.
  ISM-1690:
    surfaces: [code, infrastructure]
    tags: [patching, supply-chain]
    reason: >-
      Same as ISM-1876 at the two-week timeframe. Both are named in a note on RWA-0051 and
      are the clearest case in the ISM of a maintenance control that is actually a code and
      deployment fact.
  ISM-2032:
    surfaces: [code]
    tags: [application-security, assurance]
    reason: >-
      Section is Software development fundamentals, which carries organisational as well
      because it spans developer training and lifecycle policy. This control is about
      automated testing completing without warnings or errors, which is purely a CI fact.
