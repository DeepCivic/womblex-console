    Emanation security: {surfaces: [organisational], tags: [physical, emanation]}

  Guidelines for communications systems:
    Fax machines and services: {surfaces: [organisational], tags: [telephony]}
    Multifunction devices: {surfaces: [organisational], tags: [peripherals, hardening]}
    Telephone systems: {surfaces: [organisational], tags: [telephony]}
    Video conferencing and Internet Protocol telephony:
      {surfaces: [infrastructure, organisational], tags: [telephony, network]}

  Guidelines for cryptography:
