# runwAI path traversal and unsafe file operations (RWA-0027)
#
# The simplest file-read exploit, and the neighbour of the sink classes injection.yaml
# already covers. `open(f"/var/data/{name}")` looks like working code, reviews as working
# code, and hands the caller the whole filesystem the moment `name` contains `../`.
#
# Deliberately narrow, for the same reason the injection rules are: these match the shape
# of the defect at the sink — a path assembled by interpolation, or joined and handed
# straight to a file API — rather than tracing taint from a source. That keeps verdicts
# stable and the scan fast, and it keeps the rule quiet on the overwhelmingly common safe
# case of a literal path.
#
# WHAT THIS DOES NOT CATCH, recorded rather than implied
#
#   A path assembled several statements before the sink, through a helper function, or
#   read from a config object. Sink matching does not follow values across a call
#   boundary. A taint-mode ruleset would, at a false-positive budget nothing here has
#   agreed to yet.
#
#   Traversal through an archive entry name (zip slip), symlink following, and TOCTOU
#   races between a check and an open. All three are path-handling defects; none of them
#   has this shape.
#
# KNOWN FALSE-POSITIVE CLASSES
#
# Documented here because a rule whose noise is undocumented gets suppressed wholesale
# within a month, and a suppressed rule is a control that reports green while enforcing
# nothing.
#
#   Interpolated segment that is a module constant or an enum value
#     The sink match ignores provenance, exactly as the injection rules do. Suppress with
#     a reason naming the constant.
#   A join whose variable segment was validated by an allow-list earlier in the function
#     The rule cannot see the check. Suppress with a reason naming the validator — and
#     prefer canonicalising anyway, because an allow-list on the segment does not stop a
#     symlink inside the base directory.
#   os.path.join under a path the process controls entirely, such as a temp directory it
#   just created
#     Real, and worth a suppression rather than a rule exception: the same code copied
#     under a user-supplied base is the defect.
#
# Suppress individually and give a reason, never blanket:
#
#   # nosemgrep: runwai-python-path-join-unresolved -- segment is an enum value
#   open(os.path.join(BASE, Report(kind).filename))
#
# Requiring a reason after `--` keeps suppressions auditable. A bare `# nosemgrep` with
# no justification should fail review.
#
# REMEDIATION, per language, because "canonicalise it" is not an instruction
#
#   Python   os.path.realpath(candidate), then assert it starts with the realpath of the
#            base directory. pathlib: Path(candidate).resolve() then .is_relative_to(base).
#   Node     path.resolve(candidate), then assert it starts with path.resolve(base) plus
#            path.sep. fs.realpath resolves symlinks too and is the stronger check where
#            the file already exists.
#
# Resolving without then comparing to the base is not a fix — it normalises the path and
# still opens whatever it names.
#
# STEAL: Sink-focused semgrep rules for path traversal in Python and Node: interpolated
# paths reaching a file API, and joins handed to a sink without canonicalisation.
# Asserted in both directions in controls/tests/. Depends on semgrep only.
rules:
  - id: runwai-python-path-traversal-sink
    languages: [python]
    severity: ERROR
    message: >-
      File path built by interpolation reaches a filesystem call. Canonicalise with
      os.path.realpath and assert the result is inside the intended base directory before
      opening it. [RWA-0027 / ISM-1240, ISM-2016]
    metadata:
      runwai-control: RWA-0027
      category: security
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: open(f"...", ...)
          - pattern: open("..." + $X, ...)
          - pattern: open("..." % ..., ...)
          - pattern: open("...".format(...), ...)
          - pattern: pathlib.Path(f"...")
          - pattern: pathlib.Path("..." + $X)
          - pattern: Path(f"...")
          - pattern: Path("..." + $X)
          - pattern: os.remove(f"...")
          - pattern: os.remove("..." + $X)
          - pattern: shutil.rmtree(f"...")

  - id: runwai-python-path-join-unresolved
    languages: [python]
    severity: ERROR
    message: >-
      A joined path reaches a filesystem call without canonicalisation. os.path.join does
      not contain a segment: joining an absolute path discards the base entirely, and
      '..' walks out of it. Use os.path.realpath and check the result is inside the base.
      [RWA-0027 / ISM-1240, ISM-2016]
    metadata:
      runwai-control: RWA-0027
      category: security
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: open(os.path.join(...), ...)
          - pattern: open(os.path.join(...))
          - pattern: os.remove(os.path.join(...))
          - pattern: pathlib.Path($BASE).joinpath($SEG).open(...)
          - pattern: Path($BASE).joinpath($SEG).open(...)
          - pattern: (Path($BASE) / $SEG).read_text(...)
          - pattern: (Path($BASE) / $SEG).open(...)
      # A join of string literals carries no caller-supplied segment. This is the safe
      # case the rule has to stay quiet on, and it is by far the most common one.
      - pattern-not: open(os.path.join("...", "..."), ...)
      - pattern-not: open(os.path.join("...", "...", "..."), ...)
      - pattern-not: os.remove(os.path.join("...", "..."))
      # Already canonicalised at the sink. The comparison against the base still has to
      # happen, and no rule here can see that it did — see the header.
      - pattern-not: open(os.path.realpath(...), ...)
      - pattern-not: open(os.path.abspath(...), ...)

  - id: runwai-js-path-traversal-sink
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      File path built by interpolation reaches an fs call. Canonicalise with path.resolve
      and assert the result is inside the intended base directory before reading it.
      [RWA-0027 / ISM-1240, ISM-2016]
    metadata:
      runwai-control: RWA-0027
      category: security
      confidence: HIGH
    # The bare names are matched alongside the qualified ones because destructuring is the
    # dominant idiom (`const { readFileSync } = require("fs")`), the same reason the shell
    # rule in injection.yaml matches bare `exec`.
    patterns:
      - pattern-either:
          - pattern: fs.readFileSync(`...${$X}...`, ...)
          - pattern: fs.readFileSync("..." + $X, ...)
          - pattern: fs.readFile(`...${$X}...`, ...)
          - pattern: fs.readFile("..." + $X, ...)
          - pattern: fs.writeFileSync(`...${$X}...`, ...)
          - pattern: fs.createReadStream(`...${$X}...`, ...)
          - pattern: fs.unlinkSync(`...${$X}...`, ...)
          - pattern: readFileSync(`...${$X}...`, ...)
          - pattern: readFileSync("..." + $X, ...)
          - pattern: createReadStream(`...${$X}...`, ...)
          - pattern: unlinkSync(`...${$X}...`, ...)

  - id: runwai-js-path-join-unresolved
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      A joined path reaches an fs call without canonicalisation. path.join normalises but
      does not contain: a segment of '../..' walks out of the base. Use path.resolve and
      check the result starts with the resolved base. [RWA-0027 / ISM-1240, ISM-2016]
    metadata:
      runwai-control: RWA-0027
      category: security
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: fs.readFileSync(path.join(...), ...)
          - pattern: fs.readFile(path.join(...), ...)
          - pattern: fs.createReadStream(path.join(...), ...)
          - pattern: fs.unlinkSync(path.join(...), ...)
          - pattern: readFileSync(path.join(...), ...)
      # A join of string literals carries no caller-supplied segment.
      - pattern-not: fs.readFileSync(path.join("...", "..."), ...)
      - pattern-not: readFileSync(path.join("...", "..."), ...)
      # Already canonicalised at the sink; the containment comparison is still the
      # caller's job and no rule here can see it.
      - pattern-not: fs.readFileSync(path.resolve(...), ...)
      - pattern-not: readFileSync(path.resolve(...), ...)
