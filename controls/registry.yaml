  # ---------------------------------------------------------------------------
  # AI application security
  #
  # Every control here is probabilistic unless a reproducible assertion wraps it.
  # This is where the determinism invariant does the most work.
  # ---------------------------------------------------------------------------
  - id: RWA-0070
    ism_ids: [ISM-1924]
    title: Prompt injection mitigation
    description: Adversarial prompt testing against AI endpoints.
    domain: ai-appsec
    mechanism: posture
    enforcement: probabilistic
    blocking: false
    mapping_fidelity: supporting
    tools:
      - name: garak
        version: "0.15.1"
        class: ai-fuzz
        install: pypi
        verified_version: true
    verification_status: verified
    verification_source: controls/ism-snapshot.json
    verified_on: "2026-07-25"
    ism_text:
      ISM-1924: >-
        Generative AI applications evaluate user prompts to detect and mitigate
        adversarial inputs or suffixes designed to elicit unintended behaviour or assist
        in the generation of sensitive or harmful content.
    notes: >-
      Cannot block. Note what the control actually requires: that the application
      evaluate prompts at runtime. Fuzzing tests whether that evaluation works; it is
      not itself the control. Passing a garak run is evidence of testing, never proof
      of mitigation.

  - id: RWA-0071
    ism_ids: [ISM-2094]
    title: Content filtering for sensitive data exposure
    description: Detect and block sensitive data exposure and improper output.
    domain: ai-appsec
    mechanism: posture
    enforcement: probabilistic
    blocking: false
    mapping_fidelity: partial
    deterministic_assertion: >-
      The check does not ask whether the model behaved. It replays a fixed, committed
      corpus of recorded responses offline and asserts that no match is found for the
      pinned PII and secret pattern sets. Same corpus plus same patterns plus same tool
      versions always yields the same verdict, so the assertion is reproducible even
      though the model is not. What it verifies is that the filter works on known cases,
      not that the model is safe on unseen ones. Recorded as the shape such a check would
      need; nothing implements it yet.
    tools:
      - name: presidio-analyzer
        version: "2.2.364"
        class: pii-filter
        install: pypi
        verified_version: true
      - name: detect-secrets
        version: "1.5.0"
        class: secret-scan
        install: pypi
        verified_version: true
    verification_status: verified
    verification_source: controls/ism-snapshot.json
    verified_on: "2026-07-25"
    ism_text:
      ISM-2094: >-
        Content filtering is implemented by AI applications to detect and block sensitive
        data exposure and improper output.

