  - id: RWA-0073
    ism_ids: [ISM-2103]
    title: No training on organisational data without consent
    description: >-
      Verify provider API calls set the opt-out or zero-retention option offered by that
      provider.
    domain: ai-appsec
    mechanism: posture
    enforcement: deterministic
    blocking: false
    mapping_fidelity: partial
    tools:
      - name: semgrep
        version: "1.171.0"
        class: sast
        install: pypi
        verified_version: true
    verification_status: verified
    verification_source: controls/ism-snapshot.json
    verified_on: "2026-07-25"
    ism_text:
      ISM-2103: >-
        Organisational data generated, collected or processed by AI applications is not
        used for training, fine-tuning or improving AI models unless informed and explicit
        consent has been obtained from data owners in advance.
    notes: >-
      The draft proposed checking for `telemetry: false`, which is not a parameter on any
      major provider SDK. The real mechanism is per-provider and mostly contractual: the
      retention and training posture is usually set by the account or enterprise
      agreement, not by a request field. A SAST rule can only check the request-level
      options a given provider exposes, so this is partial at best.

  - id: RWA-0074
    ism_ids: [ISM-2072, ISM-2090]
    title: AI model storage format and inference rate limiting
    description: >-
      Require models to be stored in non-executable formats, and require rate limiting on
      inference endpoints.
    domain: ai-appsec
    mechanism: pre-commit
    enforcement: deterministic
    blocking: true
    mapping_fidelity: partial
    tools:
      - name: semgrep
        version: "1.171.0"
        class: sast
        install: pypi
        verified_version: true
    implementation:
      gate: pre-commit
      files:
        - controls/rules/deserialisation.yaml
      covers: >-
        The model-storage half only. runwai-python-model-pickle-load flags loading a model
        from a pickle-backed format; nothing here enforces inference rate limiting, so the
        control is partly mechanised and the report should not read it as covered.
      provenance:
        origin: original
        authored_by: ai-assisted
        verified_on: "2026-07-25"
    verification_status: verified
    verification_source: controls/ism-snapshot.json
    verified_on: "2026-07-25"
    ism_text:
      ISM-2072: >-
        AI models are stored in a non-executable file format that does not allow arbitrary
        code execution.
      ISM-2090: >-
        Rate limiting is applied to inference queries for AI models.
    notes: >-
      ISM-2072 is checkable and high value: loading a pickled model executes arbitrary
      code at load time, so flagging pickle-format model loading is a direct win.
