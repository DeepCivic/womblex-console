        version: "1.171.0"
        class: sast
        install: pypi
        verified_version: true
    verification_status: verified
    verification_source: controls/ism-snapshot.json
    verified_on: "2026-07-25"
    ism_text:
      ISM-1781: >-
        All data communicated over network infrastructure is encrypted using
        ASD-approved cryptography.
      ISM-1139: >-
        Only the latest version of TLS is used for TLS connections.
      ISM-1369: >-
        AES-GCM is used for encryption of TLS connections.
      ISM-1453: >-
        Perfect Forward Secrecy (PFS) is used for TLS connections.
    notes: >-
      ISM-1139 says "the latest version of TLS", not a fixed number. A rule hardcoding
      1.3 will become wrong on the next TLS release, so the ruleset bans known-old
      versions rather than asserting a specific current one.

