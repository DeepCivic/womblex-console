  # ---------------------------------------------------------------------------
  # IaC and cloud
  # ---------------------------------------------------------------------------
  - id: RWA-0040
    ism_ids: [ISM-1181, ISM-1270, ISM-1272]
    title: Network segregation and database isolation
    description: >-
      Block IaC that exposes databases to the internet, places them on the same segment
      as workstations, or leaves managed database instances publicly accessible.
    domain: iac-cloud
    mechanism: posture
    enforcement: deterministic
    blocking: false
    mapping_fidelity: partial
    tools:
      - name: checkov
        version: "3.3.8"
        class: iac-scan
        install: pypi
        verified_version: true
    verification_status: verified
    verification_source: controls/ism-snapshot.json
    verified_on: "2026-07-25"
    ism_text:
      ISM-1181: >-
        Networks are segregated into multiple network zones according to the criticality
        of servers, services and data.
      ISM-1270: >-
        Database servers are placed on a different network segment to user workstations.
      ISM-1272: >-
        If only local access to a database is required, networking functionality of
        database management system applications is disabled or directed to listen solely
        to the localhost interface.
    notes: >-
      IaC scanning sees declared infrastructure only. Resources created outside version
      control, or drifted since apply, are invisible to it.

  - id: RWA-0041
    ism_ids: [ISM-1781, ISM-1139, ISM-1369, ISM-1453]
    title: Transport encryption, current TLS, AES-GCM and PFS
    description: >-
      Require HTTPS-only listeners, the latest TLS version, AES-GCM cipher suites and
      Perfect Forward Secrecy, in both IaC and application code.
    domain: crypto
    mechanism: posture
    enforcement: deterministic
    blocking: false
    mapping_fidelity: partial
    tools:
      - name: checkov
