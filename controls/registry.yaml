  # ---------------------------------------------------------------------------
  # Containers
  #
  # The ISM has no container-specific controls: the word "container" appears in it
  # only in the physical-security sense of a security cabinet. Containers are
  # covered by the virtualisation hardening section, which defines an application
  # container as a software-based isolation mechanism consuming shared physical
  # computing resources, and states that containers should be treated the same as
  # any other system.
  # ---------------------------------------------------------------------------
  - id: RWA-0050
    ism_ids: [ISM-1604, ISM-1605]
    title: Harden the container image and its base OS
    description: >-
      Enforce non-root users, dropped capabilities, no unneeded packages, and no
      exposed management interfaces in container images.
    domain: container-os
    mechanism: posture
    enforcement: deterministic
    blocking: false
    mapping_fidelity: partial
    tools:
      - name: hadolint
        class: container-lint
        install: unavailable
    verification_status: verified
    verification_source: controls/ism-snapshot.json
    verified_on: "2026-07-25"
    ism_text:
      ISM-1604: >-
        When using a software-based isolation mechanism that consumes shared physical
        computing resources, the configuration of the isolation mechanism is hardened by
        removing unneeded functionality and restricting access to the administrative
        interface used to manage the isolation mechanism.
      ISM-1605: >-
        When using a software-based isolation mechanism that consumes shared physical
        computing resources, the underlying operating system is hardened.
    notes: >-
      Replaces the draft's mapping to ISM-1409 and ISM-1601. ISM-1601 requires
      Microsoft's attack surface reduction rules, a Windows endpoint control with no
      bearing on a Dockerfile, and was dropped.

  - id: RWA-0051
    ism_ids: [ISM-1606, ISM-1848]
    title: Patch and replace container base images
    description: >-
      Fail on base images carrying known vulnerabilities beyond a threshold, and on base
      images that are no longer vendor-supported.
    domain: container-os
    mechanism: posture
    enforcement: deterministic
    blocking: false
    mapping_fidelity: direct
    tools:
      - name: trivy
        version: "0.72.0"
        class: container-scan
        install: github-release
        verified_version: true
    verification_status: verified
    verification_source: controls/ism-snapshot.json
    verified_on: "2026-07-25"
    ism_text:
      ISM-1606: >-
        When using a software-based isolation mechanism that consumes shared physical
        computing resources, patches, updates or vendor mitigations for vulnerabilities
        are applied to the isolation mechanism and underlying operating system in a
        timely manner.
      ISM-1848: >-
        When using a software-based isolation mechanism that consumes shared physical
        computing resources, the isolation mechanism or underlying operating system is
        replaced when it is no longer supported by a vendor.
    notes: >-
      "In a timely manner" is defined elsewhere in the ISM by service class: ISM-1876
      requires 48 hours for critical vulnerabilities in online services, ISM-1690 two
      weeks for non-critical. A container serving internet traffic falls under those
      timeframes, so the scanner threshold should be set from them rather than picked.


      trivy now carries a pin, because RWA-0031 confirmed the release exists and adopted
      it. That changes nothing about this control: no implementation block, so nothing
      runs and the report still renders it as mapped. A pinned tool and a live check are
      different claims, and only the second one belongs in the "has a check behind it" row.

